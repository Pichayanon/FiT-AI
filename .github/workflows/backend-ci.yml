name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "backend/sonar-project.properties
  
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "backend/sonar-project.properties"

jobs:
  # ─────────────────────────────────────────────
  # 1. Unit tests + coverage
  # ─────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.base.txt
          pip install -r requirements.ml.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "coverage[toml]" pytest pytest-asyncio

      - name: Run tests with coverage
        env:
          PYTHONPATH: backend
        run: |
          coverage run -m pytest tests/ -v
          coverage report -i -m
          coverage xml -i -o coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ─────────────────────────────────────────────
  # 2. API tests (WebSocket end-to-end)
  # ─────────────────────────────────────────────
  api-test:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          pip install \
            websockets \
            requests \
            numpy \
            opencv-python-headless \
            certifi

      - name: Run API test suite
        env:
          BASE_HTTP: ${{ secrets.BASE_HTTP }}
          BASE_WS: ${{ secrets.BASE_WS }}
        run: |
          cd backend
          python test_api.py

  # ─────────────────────────────────────────────
  # 3. SonarCloud scan
  # ─────────────────────────────────────────────
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: backend

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────────
  # 4. Deploy to HuggingFace Spaces
  #    runs only on push to main, after both test jobs pass
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to HuggingFace
    runs-on: ubuntu-latest
    needs: [unit-test, api-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git lfs install
          git config user.email "ci@fit-ai.dev"
          git config user.name "FiT-AI CI"

          DEPLOY_DIR=$(mktemp -d)

          cp backend/README.hf.md "$DEPLOY_DIR/README.md"
          cp backend/Dockerfile.hf "$DEPLOY_DIR/Dockerfile"
          cp -r backend/shared "$DEPLOY_DIR/shared"
          cp -r backend/squat "$DEPLOY_DIR/squat"
          cp -r backend/plank "$DEPLOY_DIR/plank"
          cp -r backend/lunges "$DEPLOY_DIR/lunges"
          cp -r backend/wall_sit "$DEPLOY_DIR/wall_sit"
          cp backend/main.py "$DEPLOY_DIR/main.py"
          cp backend/requirements.base.txt "$DEPLOY_DIR/requirements.base.txt"
          cp backend/requirements.ml.txt "$DEPLOY_DIR/requirements.ml.txt"

          find "$DEPLOY_DIR" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$DEPLOY_DIR" -name "*.pyc" -delete 2>/dev/null || true
          find "$DEPLOY_DIR" -name "train_*.py" -delete 2>/dev/null || true

          cd "$DEPLOY_DIR"
          git init -b main
          git config user.email "ci@fit-ai.dev"
          git config user.name "FiT-AI CI"
          git lfs install
          git lfs track "*.pt" "*.pkl"
          git add .
          git commit -m "Deploy from ${{ github.sha }}"
          git push --force "https://Nuafah:${HF_TOKEN}@huggingface.co/spaces/Nuafah/fit-ai-ml" main
