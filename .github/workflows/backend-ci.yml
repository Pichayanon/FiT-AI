name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "sonar-project.properties"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "sonar-project.properties"

jobs:
  # ─────────────────────────────────────────────
  # 1. Run tests + coverage
  # ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.base.txt
          pip install -r requirements.ml.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=shared --cov=squat --cov=plank --cov=lunges --cov=wall_sit \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ─────────────────────────────────────────────
  # 2. SonarCloud scan with coverage
  # ─────────────────────────────────────────────
  sonar:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: backend

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────────
  # 3. Deploy to Hugging Face Spaces
  # ─────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git lfs install

          # Configure git for HF push
          git config user.email "ci@fit-ai.dev"
          git config user.name "FiT-AI CI"

          # Create a temp directory with HF deploy structure
          DEPLOY_DIR=$(mktemp -d)

          # Copy README for HF metadata
          cp backend/README.hf.md "$DEPLOY_DIR/README.md"

          # Copy Dockerfile for HF
          cp backend/Dockerfile.hf "$DEPLOY_DIR/Dockerfile"

          # Copy backend source code
          cp -r backend/shared "$DEPLOY_DIR/shared"
          cp -r backend/squat "$DEPLOY_DIR/squat"
          cp -r backend/plank "$DEPLOY_DIR/plank"
          cp -r backend/lunges "$DEPLOY_DIR/lunges"
          cp -r backend/wall_sit "$DEPLOY_DIR/wall_sit"
          cp backend/main.py "$DEPLOY_DIR/main.py"
          cp backend/requirements.base.txt "$DEPLOY_DIR/requirements.base.txt"
          cp backend/requirements.ml.txt "$DEPLOY_DIR/requirements.ml.txt"

          # Clean up non-deploy files
          find "$DEPLOY_DIR" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$DEPLOY_DIR" -name "*.pyc" -delete 2>/dev/null || true
          find "$DEPLOY_DIR" -name "train_*.py" -delete 2>/dev/null || true

          # Init git repo and push to HF
          cd "$DEPLOY_DIR"
          git init -b main
          git config user.email "ci@fit-ai.dev"
          git config user.name "FiT-AI CI"
          git lfs install
          git lfs track "*.pt" "*.pkl"
          git add .
          git commit -m "Deploy from ${{ github.sha }}"
          git push --force "https://Nuafah:${HF_TOKEN}@huggingface.co/spaces/Nuafah/fit-ai-ml" main
