x-backend-service: &backend-service
  build:
    context: .
    dockerfile: Dockerfile
  image: fit-ai-backend:latest
  working_dir: /app
  restart: unless-stopped
  environment:
    PYTHONUNBUFFERED: "1"

services:
  wall_sit:
    <<: *backend-service
    container_name: fit-ai-wall-sit
    command: ["python", "-m", "wall_sit.wall_sit_streaming"]
    ports:
      - "5050:5050"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  squat:
    <<: *backend-service
    container_name: fit-ai-squat
    command: ["python", "-m", "squat.squat_streaming"]
    ports:
      - "5051:5051"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5051/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  plank:
    <<: *backend-service
    container_name: fit-ai-plank
    command: ["python", "-m", "plank.plank_streaming"]
    ports:
      - "5052:5052"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5052/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  lunges:
    <<: *backend-service
    container_name: fit-ai-lunges
    command: ["python", "-m", "lunges.lunges_streaming"]
    ports:
      - "5053:5053"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5053/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
