[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::FutureWarning",
    "ignore::sklearn.exceptions.InconsistentVersionWarning",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*", "**/train_*.py", "**/models/*"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
